<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 222" role="img" aria-label="Zero throughput alerting: a tap filling a cup"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a5b4fc"/></marker></defs>
<rect x="1" y="1" width="638" height="220" rx="14" fill="#0d1225" stroke="#6366f1" stroke-opacity=".25"/>
<text x="20" y="26" text-anchor="start" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Zero throughput alerting: a tap filling a cup</text>
<g transform="translate(14,38)"><rect width="296" height="164" rx="12" fill="#ef4444" fill-opacity=".07" stroke="#ef4444" stroke-opacity=".6"/><text x="14" y="22" text-anchor="start" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#ef4444">Before: someone watches the cup</text><rect x="40" y="38" width="62" height="10" rx="3" fill="#94a3b8"/><rect x="92" y="38" width="10" height="24" rx="3" fill="#94a3b8"/><circle cx="97" cy="70" r="2.6" fill="#38bdf8"/><circle cx="97" cy="80" r="2.6" fill="#38bdf8"/><polygon points="84,102 110,102 107,118 87,118" fill="#38bdf8" fill-opacity=".7"/><polygon points="82,92 112,92 107,118 87,118" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linejoin="round"/><path d="M112 97 Q122 97 120 106 Q118 110 109 110" fill="none" stroke="#e2e8f0" stroke-width="2"/><circle cx="200" cy="68" r="6" fill="none" stroke="#e2e8f0" stroke-width="2"/><line x1="200" y1="74" x2="200" y2="90" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/><line x1="191" y1="81" x2="209" y2="81" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/><line x1="200" y1="90" x2="194" y2="102" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/><line x1="200" y1="90" x2="206" y2="102" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/><ellipse cx="200" cy="52" rx="8" ry="4.5" fill="none" stroke="#f59e0b" stroke-width="2"/><circle cx="200" cy="52" r="2" fill="#f59e0b"/><text x="14" y="140" text-anchor="start" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#e2e8f0">Someone must keep watching</text><text x="14" y="156" text-anchor="start" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">during every release and outage</text></g>
<g transform="translate(330,38)"><rect width="296" height="164" rx="12" fill="#10b981" fill-opacity=".07" stroke="#10b981" stroke-opacity=".6"/><text x="14" y="22" text-anchor="start" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#10b981">After: the bell rings when it stops</text><rect x="40" y="38" width="62" height="10" rx="3" fill="#94a3b8"/><rect x="92" y="38" width="10" height="24" rx="3" fill="#94a3b8"/><polygon points="82,92 112,92 107,118 87,118" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linejoin="round"/><path d="M112 97 Q122 97 120 106 Q118 110 109 110" fill="none" stroke="#e2e8f0" stroke-width="2"/><path d="M201 74 Q201 57 210 57 Q219 57 219 74 Z" fill="#ef4444"/><line x1="199" y1="74" x2="221" y2="74" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/><circle cx="210" cy="78" r="2.5" fill="#ef4444"/><path d="M225 60 Q230 66 225 72" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/><path d="M230 56 Q237 66 230 76" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/><path d="M195 60 Q190 66 195 72" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/><path d="M190 56 Q183 66 190 76" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/><text x="210" y="104" text-anchor="middle" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#ef4444">!</text><text x="14" y="140" text-anchor="start" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#e2e8f0">The flow stops, the cup stops filling,</text><text x="14" y="156" text-anchor="start" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#94a3b8">and the bell tells you (zero throughput)</text></g>
<line x1="312" y1="120" x2="328" y2="120" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/>
</svg>